name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper-api: ['26.2.build.133-stable', '26.3.build.255-stable']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cloverrep-ci-password
          MYSQL_DATABASE: cloverrep_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcloverrep-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CLOVERREP_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/cloverrep_test?allowPublicKeyRetrieval=true
      CLOVERREP_TEST_MYSQL_USER: root
      CLOVERREP_TEST_MYSQL_PASSWORD: cloverrep-ci-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build plugin
        run: ./gradlew clean build --warning-mode all -PpaperVersion=${{ matrix.paper-api }}

      - name: Verify distributable plugin JAR
        run: |
          set -euo pipefail
          JAR="build/libs/CloverRep-1.8.1.jar"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "name: CloverRep"
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.8.1'"
          unzip -l "$JAR" | grep -q 'com/slyph/cloverrep/libs/hikari/HikariDataSource.class'
          unzip -l "$JAR" | grep -q 'com/slyph/cloverrep/libs/mysql/cj/jdbc/Driver.class'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: CloverRep-1.8.1-${{ matrix.paper-api }}
          path: build/libs/CloverRep-1.8.1.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.paper-api }}
          path: build/reports/tests/test/

  smoke-paper-26-3:
    name: Paper 26.3 runtime smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download shaded 26.3 build
        uses: actions/download-artifact@v7
        with:
          name: CloverRep-1.8.1-26.3.build.255-stable
          path: dist

      - name: Start a real Paper 26.3 server and exercise commands
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT="CloverRep-CI/1.8.1 (https://github.com/slyphmp4/CloverRep)"
          API="https://fill.papermc.io/v3/projects/paper/versions/26.3/builds"
          BUILDS="$(curl -fLsS -H "User-Agent: $USER_AGENT" "$API")"
          PAPER_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty' <<< "$BUILDS")"
          test -n "$PAPER_URL"
          curl -fLsS --retry 3 -H "User-Agent: $USER_AGENT" "$PAPER_URL" -o paper.jar
          test -s paper.jar
          mkdir -p smoke/plugins
          cp dist/CloverRep-1.8.1.jar smoke/plugins/
          printf 'eula=true\n' > smoke/eula.txt
          python3 scripts/smoke_paper.py paper.jar smoke

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paper-26.3-smoke-logs
          path: smoke/logs/
          if-no-files-found: ignore
