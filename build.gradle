plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.slyph'
version = '1.8.0'
def pluginVersion = version.toString()
def paperVersion = providers.gradleProperty('paperVersion').getOrElse('26.2.build.133-stable')

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
    compileOnly 'me.clip:placeholderapi:2.12.3'

    implementation('com.zaxxer:HikariCP:7.1.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation 'com.mysql:mysql-connector-j:26.7.0'
    implementation 'com.google.protobuf:protobuf-java:4.36.2'
    implementation('com.github.ben-manes.caffeine:caffeine:3.3.0') {
        exclude group: 'org.jspecify', module: 'jspecify'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    }

    testImplementation "io.papermc.paper:paper-api:${paperVersion}"
    testImplementation 'me.clip:placeholderapi:2.12.3'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}

configurations {
    mockitoAgent
}

dependencies {
    mockitoAgent('org.mockito:mockito-core:5.24.0') { transitive = false }
}

tasks.test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
    systemProperty 'cloverrep.test.mysql.url', providers.environmentVariable('CLOVERREP_TEST_MYSQL_URL').getOrElse('')
    systemProperty 'cloverrep.test.mysql.user', providers.environmentVariable('CLOVERREP_TEST_MYSQL_USER').getOrElse('root')
    systemProperty 'cloverrep.test.mysql.password', providers.environmentVariable('CLOVERREP_TEST_MYSQL_PASSWORD').getOrElse('')
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
    inputs.property('pluginVersion', pluginVersion)
}

tasks.shadowJar {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    relocate 'com.zaxxer.hikari', 'com.slyph.cloverrep.libs.hikari'
    relocate 'com.mysql', 'com.slyph.cloverrep.libs.mysql'
    relocate 'com.google.protobuf', 'com.slyph.cloverrep.libs.protobuf'
    relocate 'com.github.benmanes.caffeine', 'com.slyph.cloverrep.libs.caffeine'
}

tasks.jar {
    archiveClassifier.set('plain')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.build {
    dependsOn tasks.shadowJar
}
