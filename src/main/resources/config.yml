# CloverRep configuration file
#
# Основной принцип:
# - config.yml отвечает за технические настройки и отображение
# - messages.yml отвечает только за текст сообщений
#
# Поддержка HEX-цветов:
# - формат "&FF0000" (рекомендуется)
# - формат "&#FF0000" (тоже поддерживается)

colors:
  reputation-positive: "&21FF5D"
  reputation-negative: "&FF2B2B"
  reputation-neutral: "&BFBFBF"
  dark-nick: "DARK_GRAY"

reputation:
  dark-nick-threshold: -20

display:
  below-name:
    enabled: false
    objective-id: "cloverrep"
    title: "&eРеп"
    force-slot: false

sounds:
  error: "ENTITY_VILLAGER_NO"

storage:
  # local - данные в plugins/CloverRep/reputation.yml
  # mysql - данные в MySQL
  type: "local"

  # 20 тиков = 1 секунда
  auto-save-ticks: 600

mysql:
  host: "localhost"
  port: 3306
  database: "minecraft"
  user: "root"
  password: "password"
  tablePrefix: "clover_"

  # Пул соединений HikariCP
  # maximum-size: максимальное количество соединений
  # minimum-idle: минимальное число простаивающих соединений
  # connection-timeout-millis: сколько ждать свободное соединение
  # idle-timeout-millis: когда закрывать простаивающее соединение
  # max-lifetime-millis: максимальное время жизни соединения
  pool:
    maximum-size: 10
    minimum-idle: 2
    connection-timeout-millis: 5000
    idle-timeout-millis: 300000
    max-lifetime-millis: 1800000
